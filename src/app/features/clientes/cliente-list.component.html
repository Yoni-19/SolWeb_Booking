<section class="page">
  <app-page-header title="Clientes" subtitle="Usuarios registrados en el sistema">
    <mat-chip-set>
      <mat-chip>Datos simulados</mat-chip>
    </mat-chip-set>
    <a mat-flat-button color="primary" routerLink="/clientes/nueva">
      <mat-icon>add</mat-icon>
      <span>Nuevo cliente</span>
    </a>
  </app-page-header>

  <div class="table-wrap">
    <table mat-table [dataSource]="clientes()" class="cliente-table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre completo</th>
        <td mat-cell *matCellDef="let c">{{ c.nombres }} {{ c.apellidos }}</td>
      </ng-container>

      <ng-container matColumnDef="correo">
        <th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let c">{{ c.correo }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let c">
          <a mat-icon-button [routerLink]="['/clientes', c.id, 'editar']" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button (click)="eliminar(c)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</section>
