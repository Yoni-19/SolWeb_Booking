<section class="page">
  <app-page-header title="Personal" subtitle="Recepcionistas y trabajadores del complejo">
    <a mat-flat-button color="primary" routerLink="/personal/nueva">
      <mat-icon>add</mat-icon>
      <span>Nuevo trabajador</span>
    </a>
  </app-page-header>

  @if (loading()) {
    <div class="personal-estado-carga">
      <mat-spinner diameter="32" strokeWidth="3" />
    </div>
  } @else if (personal().length === 0) {
    <p class="personal-vacio">No hay personal registrado.</p>
  }

  <div class="table-wrap">
    <table mat-table [dataSource]="personal()" class="personal-table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let u">{{ u.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre completo</th>
        <td mat-cell *matCellDef="let u">{{ u.nombres }} {{ u.apellidos }}</td>
      </ng-container>

      <ng-container matColumnDef="correo">
        <th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let u">{{ u.correo }}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let u">
          <mat-select
            class="rol-select"
            [value]="u.rol"
            [disabled]="cambiando() === u.id"
            (selectionChange)="cambiarRol(u, $event.value)"
            [attr.aria-label]="'Rol de ' + u.nombres + ' ' + u.apellidos"
          >
            @for (rol of roles; track rol) {
              <mat-option [value]="rol">{{ etiquetasRol[rol] }}</mat-option>
            }
          </mat-select>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let u">
          <a mat-icon-button [routerLink]="['/personal', u.id, 'editar']" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          @if (u.rol !== 'ADMIN') {
            <button mat-icon-button (click)="eliminar(u)" aria-label="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (page)="cambiarPagina($event)"
    aria-label="Paginación de personal"
  />
</section>
