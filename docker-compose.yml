# PostgreSQL local para desarrollo y pruebas.
# Se publica en 5433 para no chocar con un PostgreSQL instalado en 5432.
# Uso: docker compose up -d / docker compose down -v
services:
  postgres:
    image: postgres:17-alpine
    container_name: complejo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_complejoDeportivo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_complejoDeportivo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
