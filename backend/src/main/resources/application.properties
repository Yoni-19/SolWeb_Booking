spring.application.name=sreservas

# PostgreSQL local (Docker) por defecto, publicado en 5433 para no chocar con
# otro PostgreSQL en 5432. En produccion se sobreescribe con DB_URL, DB_USER y
# DB_PASSWORD. Con Supabase usar el Session Pooler (IPv4, puerto 5432):
# jdbc:postgresql://aws-[INDEX]-[REGION].pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/db_complejoDeportivo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=always
server.error.include-stacktrace=never

application.jwt.secret-key=${JWT_SECRET:supersecretkeythatshouldbelongandcomplexsupersecretkeythatshouldbelongandcomplex}
application.jwt.token-prefix=Bearer 
application.jwt.token-expiration-after-days=7
# La cookie se marca Secure solo sobre HTTPS (en desarrollo es http://localhost).
# En produccion: exportar COOKIE_SECURE=true.
application.auth.cookie.secure=${COOKIE_SECURE:false}
# Origenes permitidos separados por coma. Con el proxy de Vercel el navegador
# ve un unico origen y CORS no se dispara; la variable queda por si se prueba directo.
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Pool chico para el plan free de Render/Supabase. El Session Pooler de Supabase
# tolera prepared statements; no usar el transaction pooler (puerto 6543).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
